<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatNest | Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .signup-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            padding: 40px;
            width: 100%;
            max-width: 440px;
        }
        .brand-title {
            color: #38bdf8;
            font-weight: 700;
            font-size: 28px;
            text-align: center;
        }
        .form-control {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 10px;
        }
        .form-control:focus {
            background-color: #0f172a;
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
        }
        .btn-custom {
            background: #0284c7;
            border: none;
            color: #fff;
            padding: 12px;
            font-weight: 600;
            border-radius: 10px;
            width: 100%;
        }
        .btn-custom:hover { background: #0369a1; }
    </style>
</head>
<body>

    <div class="signup-card">
        <div class="brand-title mb-2">🚀 Create Account</div>
        <p class="text-center text-secondary mb-4">Get started with ChatNest Platform</p>

        <form action="/signup" method="POST">
            <div class="mb-3">
                <label class="form-label text-light fw-semibold">Full Name</label>
                <input type="text" class="form-control" name="name" placeholder="John Doe" required>
            </div>

            <div class="mb-3">
                <label class="form-label text-light fw-semibold">Email Address</label>
                <input type="email" class="form-control" name="email" placeholder="name@company.com" required>
            </div>

            <div class="mb-4">
                <label class="form-label text-light fw-semibold">Password</label>
                <input type="password" class="form-control" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-custom">Get Started</button>
        </form>

        <div class="text-center mt-4">
            <span class="text-secondary">Already registered? </span>
            <a href="/login" class="text-info text-decoration-none fw-semibold">Sign In</a>
        </div>
    </div>

</body>
</html>
